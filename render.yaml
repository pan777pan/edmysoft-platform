services:
  - type: web
    name: edmysoft-whatsapp-worker
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        value: edmysoft-secret-key-production-change-me-12345
